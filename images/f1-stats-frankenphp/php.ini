; Overrides on top of php.ini-production.
expose_php = Off
; Matches request_body max_size in the Caddyfile.
upload_max_filesize = 16M
post_max_size = 16M
; The image is immutable, so opcache never needs to stat source files.
opcache.validate_timestamps = 0
; FrankenPHP counts this in wall-clock time, where php-fpm counted CPU time. 60s
; is nginx's fastcgi_read_timeout, so a request blocked on the database still
; ends there and frees its thread; php.ini-production's 30s would cut slow pages.
max_execution_time = 60
