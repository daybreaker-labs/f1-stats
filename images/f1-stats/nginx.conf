# Runs as www-data: no user directive, an unprivileged port and every writable
# path under /tmp. TLS terminates at Traefik.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    scgi_temp_path /tmp/nginx/scgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;

    client_max_body_size 16M;

    # Laravel builds absolute URLs from HTTPS. Behind Traefik the request
    # reaches nginx over plain HTTP, so the client's scheme comes from the
    # forwarded header; the application's TrustProxies trusts no proxy.
    map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https on;
    }

    server {
        listen 8080 default_server;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # php-fpm's ping page: proves nginx and php-fpm answer without
        # booting Laravel or reaching the database.
        # The headers name what this image was built from, so a release can tell
        # when it is the one serving. add_header here replaces the server-level
        # headers for this location; a ping page needs none of them.
        location = /healthz {
            access_log off;
            add_header X-F1-Revision "__UPSTREAM_SHA__" always;
            add_header X-F1-Packaging "__PACKAGING_SHA__" always;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /healthz;
            fastcgi_param SCRIPT_FILENAME /healthz;
            fastcgi_pass 127.0.0.1:9000;
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ~* (^|/)composer\.(json|lock)$ {
            deny all;
        }

        location ~* ^/(storage|vendor)/ {
            deny all;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        error_page 404 /index.php;

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $fastcgi_https if_not_empty;
            fastcgi_hide_header X-Powered-By;
            # php-fpm.conf ends the worker at request_terminate_timeout, which
            # must stay above this value.
            fastcgi_read_timeout 60s;
        }

        # Only the front controller executes.
        location ~ \.php$ {
            return 404;
        }
    }
}
