[www]
; nginx runs in the same container; nothing else should reach FastCGI.
listen = 127.0.0.1:9000
; nginx already logs every request.
access.log = /dev/null
ping.path = /healthz
ping.response = ok
; nginx stops waiting after fastcgi_read_timeout (60s in nginx.conf), but the
; worker keeps running: max_execution_time counts CPU time only, so a request
; blocked on the database is never stopped. End it shortly after nginx has
; answered 504, so abandoned requests cannot hold the worker pool.
request_terminate_timeout = 65s
