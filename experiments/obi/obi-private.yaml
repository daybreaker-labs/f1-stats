# obi.yaml plus the OBI-side privacy settings this experiment found effective in v1.0.0:
# - attributes.select.traces.exclude [url.query]: php-fpm spans carry the FastCGI QUERY_STRING,
#   which OBI redacts only for known key names. Excluding url.full and url.path is not honored
#   (client spans always build url.full; url.path stays), so collector-scrub.yaml deletes those.
# - routes.unmatched wildcard: the default `heuristic` matcher keeps a one-off path segment as the
#   nginx route (span name and metric attribute); unmatched paths become `/**`. php-fpm spans keep
#   Laravel's route templates (`/paises/show/{id}`), which OBI harvests from the PHP process.
# db.query.text stays at its default (off).
discovery:
  instrument:
    - container_name: "f1x-fix-obi"
otel_traces_export:
  endpoint: http://f1x-collector:4318
  protocol: http/protobuf
otel_metrics_export:
  endpoint: http://f1x-collector:4318
  protocol: http/protobuf
  interval: 10s
metrics:
  features: [application]
attributes:
  select:
    traces:
      exclude: [url.query]
routes:
  unmatched: wildcard
