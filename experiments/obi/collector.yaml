# Local sink for OBI's OTLP output: nothing leaves the machine. The file exporter keeps
# every span and metric as OTLP JSON for the attribute and privacy checks.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
    verbosity: basic
  file/traces:
    path: /out/traces.jsonl
  file/metrics:
    path: /out/metrics.jsonl
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      exporters: [debug, file/metrics]
