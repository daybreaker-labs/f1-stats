# collector.yaml plus a URL scrub. OBI v1.0.0 always sets url.full on HTTP client spans (nginx's
# FastCGI hop) with the key-redacted query string, and url.path with the raw path on server spans;
# its attribute selector does not remove either. The low-cardinality http.route and span names
# stay, so the raw URL attributes are deleted.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  transform/strip-query:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "url.query")
exporters:
  debug:
    verbosity: basic
  file/traces:
    path: /out/traces.jsonl
  file/metrics:
    path: /out/metrics.jsonl
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/strip-query]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      exporters: [debug, file/metrics]
