name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          persist-credentials: false
      - name: Test release programs
        run: |
          php --version
          python3 -m unittest discover -s scripts/tests
      - name: Install pinned workflow linters
        run: |
          tools="$RUNNER_TEMP/workflow-linters"
          mkdir -p "$tools"
          curl -fsSLo "$tools/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz
          echo "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6  $tools/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          curl -fsSLo "$tools/zizmor.tar.gz" https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-aarch64-unknown-linux-gnu.tar.gz
          echo "7ff1dce33bdd18fd2a4affe63bdd47efcccca97b2cec1c1863ec26e9e2647540  $tools/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$tools/zizmor.tar.gz" -C "$tools" zizmor
          echo "$tools" >> "$GITHUB_PATH"
      - name: Lint workflow syntax
        run: actionlint
      - name: Audit workflows online
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --format=github .
